[mcp_servers.serena]
command = "bash"
args = ["scripts/navigation/serena-mcp.sh"]
enabled_tools = [
    "find_file",
    "search_for_pattern",
    "get_symbols_overview",
    "find_symbol",
    "find_referencing_symbols",
    "find_implementations",
    "find_declaration",
    "get_diagnostics_for_file",
    "get_diagnostics_for_symbol",
    "read_file",
    "list_dir",
    "list_memories",
    "read_memory",
    "initial_instructions",
]
default_tools_approval_mode = "auto"

[mcp_servers.graphify]
command = "bash"
args = ["scripts/navigation/graphify-mcp.sh"]
enabled_tools = [
    "query_graph",
    "get_node",
    "get_neighbors",
    "get_community",
    "god_nodes",
    "graph_stats",
    "shortest_path",
]
default_tools_approval_mode = "auto"
